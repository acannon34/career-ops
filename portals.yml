search_queries:
  - name: "Ashby — AI enterprise roles"
    query: 'site:jobs.ashbyhq.com "director" OR "head of" OR "VP" "AI" OR "enterprise"'
    enabled: true

  - name: "Greenhouse — AI transformation"
    query: 'site:boards.greenhouse.io "transformation" OR "solutions architect" OR "professional services" "AI"'
    enabled: true

  - name: "Lever — AI strategy"
    query: 'site:jobs.lever.co "strategy" OR "enterprise" OR "director" "AI" OR "LLM"'
    enabled: true
